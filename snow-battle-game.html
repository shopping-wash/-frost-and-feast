<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>雪原の商店｜3D戦闘ゲーム試作</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101f31;color:#f0f7ff;font-family:system-ui}canvas{display:block;touch-action:none}.hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;pointer-events:none}.panel{display:inline-block;background:#07182cd9;border:1px solid #7fa4c0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:13px}.sub{font-size:11px;color:#c4d6e8;margin-top:5px}.controls{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,53px);grid-template-rows:repeat(3,53px);gap:3px}.btn{border:1px solid #b5d3e9;background:#153e61db;color:white;border-radius:13px;font-size:22px;font-weight:700;touch-action:none;user-select:none;pointer-events:auto}.btn:active,.btn.pressed{background:#5c9fce}.attack{width:95px;height:95px;border-radius:50%;background:#a33a31dd}.restart{pointer-events:auto;background:#174665;color:white;border:1px solid #b5d3e9;border-radius:8px;padding:7px}.message{position:fixed;top:43%;left:50%;transform:translate(-50%,-50%);text-align:center;background:#07192be8;border:1px solid #a5c6dd;border-radius:12px;padding:17px;min-width:230px;display:none}.message.show{display:block}small{font-weight:400}</style></head><body><div class="hud"><div class="panel">❄ 雪原の商店｜3D戦闘試作<div id="info" class="sub">3Dモデルを読み込み中…</div><div id="stats">HP 100 ｜ 撃破 0 ｜ Wave 1</div><div class="sub">移動：方向キー / WASD　攻撃：斬撃ボタン / Space</div><button class="restart" id="restart">最初から</button></div></div><div class="controls"><div class="pad"><div></div><button class="btn" data-dir="up">▲</button><div></div><button class="btn" data-dir="left">◀</button><div></div><button class="btn" data-dir="right">▶</button><div></div><button class="btn" data-dir="down">▼</button><div></div></div><button class="btn attack" id="attack">⚔<br><small>斬撃</small></button></div><div id="message" class="message"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const scene=new T.Scene();scene.background=new T.Color(0x192f46);scene.fog=new T.Fog(0x192f46,16,38);const camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,80);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xeaf4ff,0x536073,2.1));const sun=new T.DirectionalLight(0xffe9c9,2.5);sun.position.set(6,12,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0xc8d7df,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const rockMat=new T.MeshStandardMaterial({color:0x677e8d});const treeMat=new T.MeshStandardMaterial({color:0x294f48});for(let i=0;i<35;i++){const a=i*2.399,r=10+(i%5)*2.2,x=Math.cos(a)*r,z=Math.sin(a)*r;const trunk=new T.Mesh(new T.CylinderGeometry(.14,.2,1.4),rockMat);trunk.position.set(x,.7,z);scene.add(trunk);for(let j=0;j<3;j++){const c=new T.Mesh(new T.ConeGeometry(1.15-j*.2,2.5-j*.25,7),treeMat);c.position.set(x,1.9+j*.7,z);scene.add(c)}}const loader=new GLTFLoader(),urls={Soldier:'https://threejs.org/examples/models/gltf/Soldier.glb',Xbot:'https://threejs.org/examples/models/gltf/Xbot.glb',Michelle:'https://threejs.org/examples/models/gltf/Michelle.glb'};const loaded={};let player=null,enemies=[],hp=100,kills=0,wave=1,lastAttack=-10,ended=false,elapsed=0;const keys={up:false,down:false,left:false,right:false};const info=document.querySelector('#info'),stats=document.querySelector('#stats'),message=document.querySelector('#message');function unit(id,x,z,enemy=false){const src=loaded[id];if(!src)return null;const group=new T.Group();group.position.set(x,0,z);scene.add(group);const model=src.scene.clone(true);group.add(model);const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),sc=2.25/Math.max(.1,size.y);model.scale.setScalar(sc);model.position.set(-box.getCenter(new T.Vector3()).x*sc,-box.min.y*sc,-box.getCenter(new T.Vector3()).z*sc);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});const mixer=new T.AnimationMixer(model),clips=src.animations;const anim=(name)=>{let c=clips.find(a=>new RegExp(name,'i').test(a.name));return c?mixer.clipAction(c):null};const idle=anim('idle')||clips[0]&&mixer.clipAction(clips[0]),walk=anim('walk|run'),attack=anim('attack|punch|kick|sword');if(idle)idle.play();const ring=new T.Mesh(new T.RingGeometry(.55,.68,24),new T.MeshBasicMaterial({color:enemy?0xff594f:0x48bbff,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.04;group.add(ring);return{group,mixer,idle,walk,attack,enemy,hp:enemy?55+wave*8:100,speed:enemy?1.15+wave*.07:3.8,cooldown:0,lastAction:'idle',hit:0}}function play(u,name){if(u.lastAction===name)return;const next=u[name]||u.idle;if(!next)return;const old=u[u.lastAction];if(old&&old!==next)old.fadeOut(.18);next.reset().fadeIn(.18).play();u.lastAction=name}function spawn(){const count=2+wave;for(let i=0;i<count;i++){const a=i/count*Math.PI*2+wave,r=5.5+(i%2)*1.3,id=i%2?'Michelle':'Xbot';const e=unit(id,Math.cos(a)*r,Math.sin(a)*r,true);if(e)enemies.push(e)}}function updateHud(){stats.textContent='HP '+Math.max(0,Math.ceil(hp))+' ｜ 撃破 '+kills+' ｜ Wave '+wave}function reset(){for(const e of enemies)scene.remove(e.group);enemies=[];if(player)scene.remove(player.group);player=unit('Soldier',0,0);hp=100;kills=0;wave=1;ended=false;lastAttack=-10;message.classList.remove('show');spawn();updateHud()}function swing(){if(!player||ended||elapsed-lastAttack<.6)return;lastAttack=elapsed;if(player.attack){play(player,'attack');setTimeout(()=>{if(player&&!ended)play(player,'idle')},420)}for(const e of [...enemies]){const dx=e.group.position.x-player.group.position.x,dz=e.group.position.z-player.group.position.z;if(Math.hypot(dx,dz)<2.4){e.hp-=35;e.hit=.2;if(e.hp<=0){scene.remove(e.group);enemies.splice(enemies.indexOf(e),1);kills++}}}if(!enemies.length){wave++;spawn()}updateHud()}document.querySelector('#attack').addEventListener('pointerdown',e=>{e.preventDefault();swing()});for(const b of document.querySelectorAll('[data-dir]')){const dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[dir]=true;b.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[dir]=false;b.classList.remove('pressed')})}const keyMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};window.addEventListener('keydown',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=true;e.preventDefault()}if(e.code==='Space'){swing();e.preventDefault()}});window.addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=false});document.querySelector('#restart').onclick=reset;let completed=0;for(const[id,url]of Object.entries(urls)){loader.load(url,g=>{loaded[id]=g;completed++;info.textContent='実物GLB '+completed+'/3 読み込み済';if(completed===3){info.textContent='実物GLB 3種類で戦闘中（外観は仮モデル）';reset()}},undefined,err=>{console.error(err);info.textContent=id+'のモデル読み込みに失敗しました。通信環境を確認してください。'})}const clock=new T.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.045);elapsed+=dt;if(player&&!ended){let dx=Number(keys.right)-Number(keys.left),dz=Number(keys.down)-Number(keys.up),len=Math.hypot(dx,dz);if(len){dx/=len;dz/=len;player.group.position.x=T.MathUtils.clamp(player.group.position.x+dx*dt*player.speed,-9,9);player.group.position.z=T.MathUtils.clamp(player.group.position.z+dz*dt*player.speed,-9,9);player.group.rotation.y=Math.atan2(dx,dz);if(elapsed-lastAttack>.45)play(player,'walk')}else if(elapsed-lastAttack>.45)play(player,'idle');player.mixer.update(dt);for(const e of enemies){const v=player.group.position.clone().sub(e.group.position),d=Math.hypot(v.x,v.z);if(d>1.2){e.group.position.addScaledVector(v.normalize(),dt*e.speed);play(e,'walk')}else{play(e,'idle');e.cooldown-=dt;if(e.cooldown<=0){hp-=8+wave*1.5;e.cooldown=1.5;updateHud();if(hp<=0){ended=true;message.innerHTML='戦闘終了<br>撃破 '+kills+'体<br>「最初から」で再挑戦';message.classList.add('show')}}}e.group.rotation.y=Math.atan2(v.x,v.z);e.mixer.update(dt);e.hit=Math.max(0,e.hit-dt);e.group.scale.setScalar(e.hit?1.05:1)}camera.position.lerp(new T.Vector3(player.group.position.x+5,7.8,player.group.position.z+10),.045);camera.lookAt(player.group.position.x,1,player.group.position.z)}else camera.position.set(5,8,11);renderer.render(scene,camera)}loop();window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};</script></body></html>
