<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>雪原の商店｜自動戦闘</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#152b40;color:#eef7ff;font:13px system-ui}canvas{display:block;touch-action:none}.top{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:8px;right:8px;background:#081b2de8;border:1px solid #86a8c0;border-radius:11px;padding:10px;pointer-events:none}.top strong{font-size:15px}.stat{display:flex;justify-content:space-between;gap:7px;margin-top:5px;font-weight:700}.status{color:#c8deef;font-size:11px;margin-top:5px}.bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 7px);left:6px;right:6px;background:#081b2dec;border:1px solid #86a8c0;border-radius:12px;padding:9px}.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.unit{border:1px solid #8eb9d5;border-radius:9px;background:#1d4766;color:white;padding:9px 2px;font:700 12px system-ui}.unit small{font-size:10px;display:block;font-weight:400;margin-top:3px}.unit:disabled{opacity:.42}.upgrade{display:flex;gap:5px;margin-top:7px}.upgrade button{flex:1;border:1px solid #c5a768;background:#59482c;color:white;border-radius:8px;padding:10px 2px;font:700 11px system-ui}.upgrade button:disabled{opacity:.4}.bottom .note{font-size:10px;color:#bed4e5;margin-top:6px;text-align:center}.toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:#061829e8;padding:14px;border:1px solid #a7d1e6;border-radius:9px;display:none;text-align:center}.toast.show{display:block}.top,.bottom{border-color:#b59c70;box-shadow:0 2px 12px #0006}.unit{background:linear-gradient(140deg,#2a4d6d,#132c47);border-color:#b59c70}.upgrade button{background:linear-gradient(140deg,#615032,#292c30)}.toast{z-index:5}.side{position:fixed;top:calc(env(safe-area-inset-top) + 112px);left:8px;display:grid;gap:7px}.side button{width:43px;height:43px;border-radius:50%;border:1px solid #c5a36d;background:#0c1d30e8;color:#f6e7c5;font-size:19px;font-weight:800}</style></head><body><div class="top"><strong>❄ 雪原の商店 — 雪原防衛戦</strong><div class="stat"><span id="gold">🪙 300</span><span id="wave">Wave 1</span><span id="base">🏰 城HP 300</span></div><div id="status" class="status">兵士を投入すると自動で戦います</div></div><div class="side"><button id="pause" aria-label="一時停止">Ⅱ</button><button id="fast" aria-label="速度切替">×1</button><button id="camera" aria-label="カメラ切替">◉</button></div><div class="bottom"><div class="units"><button class="unit" data-buy="sword">⚔ 傭兵<small>80コイン / 近接</small></button><button class="unit" data-buy="shield">🛡 盾兵<small>110コイン / 防御</small></button><button class="unit" data-buy="archer">🏹 弓兵<small>90コイン / 遠距離</small></button></div><div class="upgrade"><button data-up="sword">傭兵 Lv1 ↑</button><button data-up="shield">盾兵 Lv1 ↑</button><button data-up="archer">弓兵 Lv1 ↑</button></div><div class="note">兵士は自動で索敵・移動・攻撃。撃破でコイン獲得。Lv3が上限。城を守り抜こう。</div></div><div class="toast" id="toast"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">import * as T from'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{clone as cloneSkeleton}from'three/addons/utils/SkeletonUtils.js';const scene=new T.Scene();scene.background=new T.Color(0x899fb6);scene.fog=new T.FogExp2(0xb2c4d3,.018);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,18,25);camera.lookAt(0,0,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xe9f5ff,0x51606c,2.3));const light=new T.DirectionalLight(0xffe9c7,2.4);light.position.set(-6,12,7);scene.add(light);const ground=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0xd8e5ee}));ground.rotation.x=-Math.PI/2;scene.add(ground);const stone=new T.MeshStandardMaterial({color:0x718596});const roof=new T.MeshStandardMaterial({color:0x354d65});function box(x,y,z,w,h,d,mat=stone){const o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);scene.add(o);return o}box(0,1,10,10,2.4,2.3);for(let x=-4.6;x<=4.6;x+=1.15)box(x,2.48,10,.83,.65,2.4);for(const x of [-3.5,3.5]){box(x,2,10,1.6,4,1.6);const cone=new T.Mesh(new T.ConeGeometry(1.3,2.1,4),roof);cone.position.set(x,5,10);cone.rotation.y=Math.PI/4;scene.add(cone)}for(let side of [-1,1]){const pole=new T.Mesh(new T.CylinderGeometry(.06,.06,5,8),stone);pole.position.set(side*4.7,2.5,8.5);scene.add(pole);const flag=new T.Mesh(new T.PlaneGeometry(1.5,2.1),new T.MeshStandardMaterial({color:0x2455a1,side:T.DoubleSide}));flag.position.set(side*4.7,3.8,8.5);scene.add(flag)}for(const side of [-1,1])for(let k=0;k<7;k++){const x=side*(6+k*.85);const post=new T.Mesh(new T.CylinderGeometry(.08,.1,1.6,6),new T.MeshStandardMaterial({color:0x4e3b30}));post.position.set(x,.8,-3);scene.add(post);const tip=new T.Mesh(new T.ConeGeometry(.15,.4,6),stone);tip.position.set(x,1.8,-3);scene.add(tip)}for(let i=0;i<26;i++){const a=i*2.399,r=15+(i%4)*2.2,x=Math.cos(a)*r,z=Math.sin(a)*r;const trunk=new T.Mesh(new T.CylinderGeometry(.13,.18,1.4),stone);trunk.position.set(x,.7,z);scene.add(trunk);for(let j=0;j<3;j++){const c=new T.Mesh(new T.ConeGeometry(.9-j*.12,2-j*.2,7),new T.MeshStandardMaterial({color:0x315a51}));c.position.set(x,1.6+j*.6,z);scene.add(c)}}const snow=[];const snowMat=new T.MeshBasicMaterial({color:0xffffff});for(let i=0;i<110;i++){const flake=new T.Mesh(new T.SphereGeometry(.025,4,4),snowMat);flake.position.set((Math.random()-.5)*30,Math.random()*12,(Math.random()-.5)*30);scene.add(flake);snow.push(flake)}const urls={sword:'https://gobkit.com/freebies/human003/Footman.glb',shield:'https://gobkit.com/freebies/human003/HeavyWarrior.glb',archer:'https://gobkit.com/freebies/human003/Archer.glb',enemySword:'https://gobkit.com/freebies/human006/OrcLegionary.glb',enemyShield:'https://gobkit.com/freebies/human006/OrcShieldBearer.glb',enemyArcher:'https://gobkit.com/freebies/human006/OrcLegionArcher.glb'},assets={},loader=new GLTFLoader();let gold=300,wave=1,castle=300,allies=[],enemies=[],particles=[],spawnTimer=1,remaining=4,breakTime=0,ended=false,elapsed=0,paused=false,speedMultiplier=1,cameraMode=0;const levels={sword:1,shield:1,archer:1},costs={sword:80,shield:110,archer:90},stats={sword:{hp:115,atk:24,range:1.7,speed:2.5,rate:1.05},shield:{hp:230,atk:12,range:1.7,speed:1.65,rate:1.3},archer:{hp:75,atk:19,range:7,speed:1.8,rate:1.5}},ui={gold:document.querySelector('#gold'),wave:document.querySelector('#wave'),base:document.querySelector('#base'),status:document.querySelector('#status')};function refresh(){ui.gold.textContent='🪙 '+gold;ui.wave.textContent='Wave '+wave+' / 5';ui.base.textContent='🏰 城HP '+Math.max(0,Math.ceil(castle));document.querySelectorAll('[data-buy]').forEach(b=>b.disabled=ended||gold<costs[b.dataset.buy]||!assets[b.dataset.buy]);document.querySelectorAll('[data-up]').forEach(b=>{const t=b.dataset.up,l=levels[t],price=l===1?150:260;b.textContent=t==='sword'?'傭兵':t==='shield'?'盾兵':'弓兵';b.textContent+=' Lv'+l+(l<3?' ↑ '+price:' MAX');b.disabled=ended||l>=3||gold<price})}function unit(type,enemy,x,z){
 const src=assets[enemy?'enemy'+type[0].toUpperCase()+type.slice(1):type];if(!src)return null;
 const root=new T.Group();root.position.set(x,0,z);scene.add(root);
 const model=cloneSkeleton(src.scene);root.add(model);
 const scale=type==='shield'?1.08:type==='archer'?.93:1;
 model.scale.setScalar(scale);model.position.set(0,0,0);model.rotation.y=0;
 model.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.frustumCulled=false;o.visible=true;}});
 const mixer=new T.AnimationMixer(model);
 const clips=src.animations;
 function clip(rx){const c=clips.find(item=>rx.test(item.name));return c?mixer.clipAction(c):null;}
 const idle=clip(/idle/i)||(clips.length?mixer.clipAction(clips[0]):null);
 const walk=clip(/walk|run/i);
 const attack=clip(/attack|punch|kick/i);
 if(idle)idle.play();
 const hpBar=new T.Mesh(new T.PlaneGeometry(.86,.09),new T.MeshBasicMaterial({color:enemy?0xe34b48:0x47c879,side:T.DoubleSide}));hpBar.position.set(0,2.45,0);root.add(hpBar);
 const level=enemy?Math.min(3,Math.ceil(wave/3)):levels[type];
 const base=enemy?{hp:90+wave*23,atk:8+wave*2,range:1.6,speed:1.1+wave*.08,rate:1.7}:stats[type];
 const hp=base.hp*(enemy?1:1+(level-1)*.5);
 const atk=base.atk*(enemy?1:1+(level-1)*.55);
 return {type,enemy,root,mixer,idle,walk,attack,action:idle,hpBar,hp,maxhp:hp,atk,range:base.range,speed:base.speed,rate:base.rate,cooldown:Math.random()*.8,attackHold:0,walkPhase:Math.random()*6.28,model,level};
}
function anim(u,a){const next=u[a]||u.walk||u.idle;if(!next||next===u.action)return;if(u.action)u.action.fadeOut(.12);next.reset().fadeIn(.12).play();u.action=next}function buy(type){if(ended||gold<costs[type]||!assets[type])return;gold-=costs[type];const x=(Math.random()-.5)*5;const soldier=unit(type,false,x,type==='archer'?6:type==='shield'?2.8:4.3);if(soldier)allies.push(soldier);refresh()}function upgrade(type){const l=levels[type],price=l===1?150:260;if(ended||l>=3||gold<price)return;gold-=price;levels[type]++;for(const a of allies)if(a.type===type){const old=a.maxhp;a.maxhp*=1.4;a.hp+=a.maxhp-old;a.atk*=1.5;a.level=levels[type]}refresh()}document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>upgrade(b.dataset.up));function nearest(u,targets){let found=null,best=Infinity;for(const t of targets){const d=u.root.position.distanceTo(t.root.position);if(d<best){best=d;found=t}}return{target:found,d:best}}function damage(u,target){target.hp-=u.atk;target.hpBar.scale.x=Math.max(0,target.hp/target.maxhp);if(target.hp<=0){scene.remove(target.root);const arr=target.enemy?enemies:allies;arr.splice(arr.indexOf(target),1);if(target.enemy){gold+=30+wave*5;refresh()}}}function shoot(u,target){const origin=u.root.position.clone().add(new T.Vector3(0,1.4,0)),end=target.root.position.clone().add(new T.Vector3(0,1.2,0)),dir=end.clone().sub(origin);const arrow=new T.Mesh(new T.CylinderGeometry(.025,.025,.7,5),new T.MeshStandardMaterial({color:0x654321}));arrow.position.copy(origin);arrow.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir.clone().normalize());scene.add(arrow);particles.push({mesh:arrow,origin,end,t:0,target,source:u});}function updateUnit(u,dt){u.cooldown-=dt;u.attackHold=Math.max(0,u.attackHold-dt);const foes=u.enemy?allies:enemies,{target,d}=nearest(u,foes);if(!target){if(u.enemy){anim(u,'walk');if(!u.walk){u.walkPhase+=dt*10;u.model.position.y=Math.abs(Math.sin(u.walkPhase))*.06}u.root.position.z+=u.speed*dt;u.root.rotation.y=0;if(u.root.position.z>=9){castle-=16+wave*3;scene.remove(u.root);enemies.splice(enemies.indexOf(u),1);refresh()}}else{anim(u,'idle');u.model.position.y=0;u.root.rotation.y=Math.sin(elapsed*.8+u.root.position.x)*.18}u.mixer.update(dt);return}const p=u.root.position,q=target.root.position,dx=q.x-p.x,dz=q.z-p.z;u.root.rotation.y=Math.atan2(dx,dz);if(d>u.range){const m=Math.hypot(dx,dz);p.x+=dx/m*u.speed*dt;p.z+=dz/m*u.speed*dt;anim(u,'walk');if(!u.walk){u.walkPhase+=dt*11;u.model.position.y=Math.abs(Math.sin(u.walkPhase))*.075;u.model.rotation.z=Math.sin(u.walkPhase)*.045}}else{u.model.position.y=0;u.model.rotation.z=0;if(u.attackHold<=0)anim(u,'idle');if(u.cooldown<=0){u.cooldown=u.rate;u.attackHold=.55;anim(u,'attack');if(u.type==='archer')shoot(u,target);else damage(u,target)}}u.mixer.update(dt)}function lose(){ended=true;const el=document.querySelector('#toast');el.innerHTML='🏰 城が陥落しました<br>Wave '+wave+' / 撃破後に再挑戦するにはページを再読み込み';el.classList.add('show');refresh()}const clock=new T.Clock();function loop(){requestAnimationFrame(loop);const dt=(paused?0:Math.min(.045,clock.getDelta())*speedMultiplier);elapsed+=dt;if(!ended&&!paused){if(remaining>0){spawnTimer-=dt;if(spawnTimer<=0){const t=wave%3===0?'shield':Math.random()<.65?'sword':'archer',x=(Math.random()-.5)*11;const e=unit(t,true,x,-6);if(e)enemies.push(e);remaining--;spawnTimer=Math.max(.65,2.2-wave*.1)}}else if(!enemies.length){breakTime+=dt;if(breakTime>3){if(wave>=5){ended=true;const el=document.querySelector('#toast');el.textContent='🏆 防衛成功！ 全5Waveを突破';el.classList.add('show');refresh()}else{wave++;remaining=3+wave*2;spawnTimer=1;breakTime=0;gold+=80;refresh()}}}for(const a of [...allies])if(allies.includes(a))updateUnit(a,dt);for(const e of [...enemies])if(enemies.includes(e))updateUnit(e,dt);for(const p of [...particles]){p.t+=dt*4;p.mesh.position.lerpVectors(p.origin,p.end,Math.min(1,p.t));if(p.t>=1){scene.remove(p.mesh);particles.splice(particles.indexOf(p),1);if((p.target.enemy?enemies:allies).includes(p.target))damage(p.source,p.target)}}if(castle<=0)lose();ui.status.textContent='味方 '+allies.length+'体 / 敵 '+enemies.length+'体 ｜ 自動移動・戦闘中'}for(const flake of snow){flake.position.y-=dt*.8;if(flake.position.y<0)flake.position.y=12}renderer.render(scene,camera)}for(const[t,url]of Object.entries(urls)){loader.load(url,g=>{assets[t]=g;refresh();if(Object.keys(assets).length===6){ui.status.textContent='準備完了：兵士を投入してください';refresh()}},undefined,e=>{console.error(e);ui.status.textContent='3Dモデルの読み込みに失敗：'+t})}refresh();loop();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ';clock.getDelta()};document.querySelector('#fast').onclick=()=>{speedMultiplier=speedMultiplier===1?2:1;document.querySelector('#fast').textContent='×'+speedMultiplier};document.querySelector('#camera').onclick=()=>{cameraMode=(cameraMode+1)%3;camera.position.set(...[[0,18,25],[0,12,17],[11,15,21]][cameraMode]);camera.lookAt(0,0,0)};</script></body></html>
