<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>雪原の商店｜戦争試作版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14232f;color:#f4f4e9;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}button{cursor:pointer;border:1px solid #638ba0;border-radius:11px;background:#21465b;color:white;font-weight:700;padding:10px 12px;font-size:13px}button:disabled{opacity:.35}#top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:12px;background:linear-gradient(#0b1e2bdf,#0b1e2b00);display:flex;gap:8px;align-items:center;flex-wrap:wrap}#top>*{pointer-events:auto}#top b{font-size:14px}#top span{font-size:12px;background:#123142cc;padding:8px;border-radius:9px}#actions{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto}#actions button{background:#153c50e8}#status{position:absolute;top:83px;left:12px;max-width:min(410px,calc(100vw - 24px));font-size:12px;line-height:1.55;background:#102b3cbd;padding:10px 13px;border-radius:12px}#modal{position:fixed;inset:0;background:#07121ed9;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}#modal.show{display:flex}.panel{width:min(460px,100%);max-height:83dvh;overflow:auto;background:#edf2ec;color:#1a343c;border-radius:20px;padding:20px}.panel h2{margin:0 0 10px}.panel p{font-size:13px;line-height:1.7}.panel button{margin:4px}.panel .line{border-top:1px solid #cdd9d8;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.panel .line div{font-size:13px}.panel .line small{display:block;color:#526a70}#notice{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:21px;font-weight:900;text-shadow:0 3px 10px #000;pointer-events:none;text-align:center;max-width:90%}#help{position:absolute;right:10px;bottom:85px;background:#102b3cb0;border-radius:8px;padding:6px;font-size:10px;opacity:.8}button:focus-visible{outline:3px solid #f7c764}
</style></head><body><div id="ui"><div id="top"><b>❄️ 雪原の商店｜戦争試作</b><span id="coins"></span><span id="land"></span><span id="army"></span></div><div id="status"></div><div id="notice"></div><div id="help">ドラッグ：視点回転　ピンチ：ズーム</div><div id="actions"><button id="shop">🏪 商店</button><button id="recruit">⚔️ 兵士</button><button id="fort">🏰 防衛建設</button><button id="attack">🚩 領土攻略</button><button id="return">↩ 本拠地</button></div></div><div id="modal"><div class="panel"><h2 id="mt"></h2><div id="mb"></div><button id="close">閉じる</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=x=>document.getElementById(x),key='frost-war-prototype-v1',costs={wall:[80,120,180,260],tower:[100,150,220,320],cannon:[160,230,320,450]},names={wall:'城壁',tower:'弓兵塔',cannon:'大砲'},territories=['雪の村','北の監視砦','氷晶鉱山','黒鉄の城塞','氷の王城'];
const defaults=()=>({coins:500,land:0,army:{sword:5,shield:2,archer:2},levels:{sword:1,shield:1,archer:1},fort:{wall:1,tower:1,cannon:0},wins:0,losses:0});
let save;try{save={...defaults(),...JSON.parse(localStorage.getItem(key)||'null')}}catch{save=defaults()}if(!save.army)save=defaults();
const persist=()=>{try{localStorage.setItem(key,JSON.stringify(save))}catch{}};
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa6c2d0);scene.fog=new THREE.Fog(0xa6c2d0,28,85);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,120);const light=new THREE.DirectionalLight(0xfff2dc,2.4);light.position.set(-12,22,8);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light,new THREE.HemisphereLight(0xeaf6ff,0x536679,2.1));let root=new THREE.Group();scene.add(root);
const materials={};function mat(c){return materials[c]||(materials[c]=new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:c===0xaebdc5?.48:.05}))}
const cube=new THREE.BoxGeometry(1,1,1),sphere=new THREE.SphereGeometry(1,10,8),cylinder=new THREE.CylinderGeometry(1,1,1,10);
function shape(parent,geo,color,x,y,z,a,b,c){const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);m.scale.set(a,b,c);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function block(p,c,x,y,z,a,b,d){return shape(p,cube,c,x,y,z,a,b,d)}function orb(p,c,x,y,z,a,b,d){return shape(p,sphere,c,x,y,z,a,b,d)}
let mode='home',fight=null,units=[],shots=[],last=performance.now(),elapsed=0,invasion=0,nextRaid=0,raidNo=0,angle=.68,zoom=1,drag=false,px=0,py=0,base;
function ground(){block(root,0xe7f1f3,0,-.24,0,39,.45,34);for(let i=0;i<45;i++){let x=Math.sin(i*31.1)*17,z=Math.cos(i*17.7)*14;if(Math.abs(x)<11&&Math.abs(z)<10)continue;const tree=new THREE.Group();tree.position.set(x,0,z);root.add(tree);shape(tree,cylinder,0x5d5347,0,.6,0,.22,1.2,.22);shape(tree,new THREE.ConeGeometry(1,2.4,6),0x2f6265,0,2,0,1.05,1.2,1.05);orb(tree,0xeaf5fa,0,2.9,0,.7,.2,.7)}}
function makeFort(){const f=save.fort;let height=.9+f.wall*.48;for(let side of [-1,1]){for(let i=-5;i<=5;i++){block(root,f.wall>=3?0x7c8c98:0x907b69,i*1.85,height/2,side*9,1.8,height,.7);block(root,f.wall>=3?0x7c8c98:0x907b69,side*10,height/2,i*1.6,.7,height,1.5)}}for(let x of [-9.7,9.7])for(let z of [-8.7,8.7]){block(root,0x788b97,x,1.5,z,2.2,3,2.2);block(root,0x526977,x,3.2,z,2.7,.5,2.7)}block(root,0x8d6e54,0,height/2,9,3.4,height,1.1);
for(let i=0;i<Math.max(1,f.tower);i++){let x=i%2?-8:8,z=i<2?-7:7;block(root,0x84949f,x,2.5,z,1.8,5,1.8);block(root,0x516b85,x,5.15,z,2.5,.6,2.5);for(let j=0;j<4;j++)block(root,0x91b8d5,x+(j-1.5)*.35,5.8,z,.15,.8,.18)}
for(let i=0;i<f.cannon;i++){let x=(i%3-1)*4,z=i<3?7:-7;block(root,0x6e5c50,x,.65,z,1.2,.8,1.4);shape(root,cylinder,0x353d46,x,1.2,z,.35,1.5,.35).rotation.x=Math.PI/2}}
function makeShop(){block(root,0xa07755,0,1,0,5,2,4);const roof=block(root,0x546d7b,0,2.5,0,5.7,.6,4.7);roof.rotation.z=.08;block(root,0x6b8a91,-5,1,-2,3,2.1,2.5);block(root,0xc48b56,5,1,-2,3,2.1,2.5);for(let x of [-4,4])for(let z of [3,5]){block(root,0x7a614d,x,.55,z,2,.3,1.3);orb(root,0xe8b66b,x,.95,z,.55,.2,.55)}}
function buildWorld(){scene.remove(root);root=new THREE.Group();scene.add(root);units=[];shots=[];ground();if(mode==='home'){makeShop();makeFort();base={x:0,z:0,hp:120+save.fort.wall*100,max:120+save.fort.wall*100};spawnTeam(0,Math.min(save.army.sword,10),Math.min(save.army.shield,8),Math.min(save.army.archer,8),-3)}else{const tier=save.land+1;for(let x of [-9,9])for(let z of [-7,7])block(root,0x604f55,x,2,z,2,4,2);for(let x=-7;x<=7;x+=2)block(root,0x79747c,x,1,7,1.9,2,.8);block(root,0x534f5d,0,1.6,7,3.5,3.2,1);block(root,0x9a7770,0,2,11,5,4,4);base={x:0,z:10,hp:140+tier*105,max:140+tier*105};spawnTeam(0,Math.min(save.army.sword,10),Math.min(save.army.shield,8),Math.min(save.army.archer,8),-10);spawnTeam(1,4+tier*2,Math.max(0,tier-1),Math.max(0,tier-2),5);fight={type:'attack',time:0,tier}}}
function soldier(team,type,x,z,level=1){const g=new THREE.Group();root.add(g);g.position.set(x,0,z);const blue=team===0,armor=blue?0x6d9fca:0x9b4d50;block(g,armor,0,1.05,0,.7,.95,.48);orb(g,0xe0b99e,0,1.72,0,.32,.32,.3);block(g,level>=3?0xb3c0ca:armor,0,1.94,0,.72,.24,.6);for(let side of [-1,1]){block(g,0x454d5a,side*.2,.42,0,.23,.8,.25);block(g,armor,side*.46,1.05,0,.22,.7,.23)}if(type==='shield')block(g,blue?0x4a81b1:0x853d43,-.55,1.15,.25,.22,1.15,.8);else if(type==='archer'){block(g,0x775c42,.55,1.05,.2,.1,1.4,.1)}else{block(g,0xc5d0d4,.55,1.05,.2,.12,1.2,.16)}if(level>=4)block(g,blue?0x376dba:0x642c36,0,1.15,-.36,.52,.9,.1);const u={g,team,type,level,hp:(type==='shield'?85:type==='archer'?43:60)*(1+(level-1)*.27),max:0,cd:Math.random(),x,z,phase:Math.random()*6};u.max=u.hp;units.push(u);return u}
function spawnTeam(team,s,sh,a,z){let n=0;for(const [type,count] of [['shield',sh],['sword',s],['archer',a]])for(let i=0;i<count;i++){let x=((n%7)-3)*1.25,zz=z+Math.floor(n/7)*1.4*(team?1:-1);soldier(team,type,x,zz,team?Math.max(1,save.land):save.levels[type]);n++}}
function clearDead(){for(let i=units.length-1;i>=0;i--)if(units[i].hp<=0){root.remove(units[i].g);units.splice(i,1)}}
function projectile(a,b,color){const g=orb(root,color,a.x,1.3,a.z,.12,.12,.12);shots.push({g,from:a,to:b,t:0})}
function combat(dt){if(!fight)return;fight.time+=dt;for(const u of units){const enemies=units.filter(v=>v.team!==u.team&&v.hp>0);if(!enemies.length)continue;enemies.sort((a,b)=>(a.x-u.x)**2+(a.z-u.z)**2-( (b.x-u.x)**2+(b.z-u.z)**2));const e=enemies[0],d=Math.hypot(e.x-u.x,e.z-u.z),range=u.type==='archer'?8:1.35;u.cd-=dt;u.g.rotation.y=Math.atan2(e.x-u.x,e.z-u.z);if(d>range){const speed=u.type==='shield'?1.25:1.85;u.x+=(e.x-u.x)/d*dt*speed;u.z+=(e.z-u.z)/d*dt*speed;u.g.position.set(u.x,Math.sin(fight.time*9+u.phase)*.055,u.z)}else if(u.cd<=0){u.cd=u.type==='archer'?1.45:.85;const dmg=(u.type==='archer'?13:u.type==='shield'?8:15)*(1+(u.level-1)*.3);e.hp-=dmg;if(u.type==='archer')projectile(u,e,u.team?0xff806d:0x8ddcff);else u.g.position.y=.17}}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.t+=dt*3;s.g.position.lerpVectors(new THREE.Vector3(s.from.x,1.3,s.from.z),new THREE.Vector3(s.to.x,1.3,s.to.z),Math.min(1,s.t));s.g.position.y+=Math.sin(Math.min(1,s.t)*Math.PI)*1.6;if(s.t>=1){root.remove(s.g);shots.splice(i,1)}}
clearDead();const allies=units.filter(u=>u.team===0),enemies=units.filter(u=>u.team===1);if(fight.type==='defense'&&enemies.length){const near=enemies.filter(e=>Math.hypot(e.x,e.z)<3.7);for(const e of near)base.hp-=dt*(4+save.land*2);if(save.fort.tower>0){fight.towerCd=(fight.towerCd||0)-dt;if(fight.towerCd<=0){fight.towerCd=Math.max(.45,2.5-save.fort.tower*.35);enemies[0].hp-=8+save.fort.tower*8;projectile({x:8,z:-7},enemies[0],0xb4ecff)}}if(save.fort.cannon>0){fight.cannonCd=(fight.cannonCd||0)-dt;if(fight.cannonCd<=0){fight.cannonCd=Math.max(1.4,5-save.fort.cannon*.5);for(const e of enemies.slice(0,3))e.hp-=15+save.fort.cannon*9;projectile({x:0,z:7},enemies[0],0xffc275)}}}
if(fight.type==='attack'&&enemies.length&&allies.length){const target=allies.filter(a=>Math.hypot(a.x,a.z-10)<5);if(target.length)base.hp-=dt*target.length*5}
if(base.hp<=0||(fight.type==='attack'&&!enemies.length)||(fight.type==='defense'&&!enemies.length)||!allies.length||fight.time>135){const won=fight.type==='attack'?base.hp<=0||!enemies.length:enemies.length===0&&base.hp>0;finish(won)}}
function finish(won){const type=fight.type;fight=null;if(won){if(type==='attack'){save.land=Math.min(5,save.land+1);save.coins+=180+save.land*90;notice('領土制圧成功！ '+territories[save.land-1]);save.wins++}else{save.coins+=65+save.land*20;notice('防衛成功！ 報酬を獲得');save.wins++}}else{save.coins=Math.max(0,save.coins-60-save.land*25);save.losses++;notice(type==='attack'?'攻略失敗。軍を撤退':'防衛失敗。コインを失った')}persist();mode='home';buildWorld();nextRaid=elapsed+Math.max(70,230-save.land*26);update()}
function raid(){if(mode!=='home'||fight||save.land===0)return;fight={type:'defense',time:0};raidNo++;const n=4+save.land*3;for(let i=0;i<n;i++){const side=i%3;const x=side===0?-15:side===1?15:(i%7-3)*2.2,z=side===2?-13:(i%5-2)*3;soldier(1,i%5===0?'archer':i%4===0?'shield':'sword',x,z,Math.max(1,save.land))}notice('⚠️ 敵軍が本拠地に侵攻！');update()}
function notice(s){$('notice').textContent=s;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('notice').textContent='',2600)}
function update(){$('coins').textContent='🪙 '+save.coins.toLocaleString();$('land').textContent='領土 '+save.land+'/5';$('army').textContent='兵士 '+Object.values(save.army).reduce((a,b)=>a+b,0);$('return').style.display=mode==='attack'?'':'none';$('status').innerHTML=mode==='attack'?'⚔️ '+territories[save.land]+' 攻略中<br>敵拠点耐久 '+Math.max(0,Math.ceil(base.hp))+'/'+base.max: fight?'🚨 防衛戦！ 本拠地耐久 '+Math.max(0,Math.ceil(base.hp))+'/'+base.max:'🏪 商店の防衛拠点 Lv.'+Math.max(save.fort.wall,save.fort.tower,save.fort.cannon)+'<br>次の敵襲：'+(save.land===0?'領土獲得後に発生':Math.max(0,Math.ceil(nextRaid-elapsed))+'秒')+' ｜ 商店収入：10秒ごとに25G'}
function panel(title,html){$('mt').textContent=title;$('mb').innerHTML=html;$('modal').classList.add('show')}function close(){$('modal').classList.remove('show')} $('close').onclick=close;
$('shop').onclick=()=>panel('🏪 商店', '<p>本試作版では商店の収入を自動化しています。10秒ごとに25コインを獲得。既存ゲームのセーブデータとは完全に別管理です。</p><p>戦争機能を試すための独立した3Dプロトタイプです。</p>');
$('recruit').onclick=()=>{let html='<p>兵士を雇用・強化します。兵種ごとの強化は全兵士に適用されます。</p>';for(const [type,label,cost] of [['sword','剣士',60],['shield','盾兵',85],['archer','弓兵',90]]){html+='<div class="line"><div><b>'+label+' '+save.army[type]+'人</b><small>兵種レベル '+save.levels[type]+'/5</small></div><div><button data-buy="'+type+'">雇用 '+cost+'G</button><button data-level="'+type+'">強化 '+(100*save.levels[type])+'G</button></div></div>'}panel('⚔️ 兵士の育成',html);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const c={sword:60,shield:85,archer:90}[b.dataset.buy];if(save.coins<c)return notice('コイン不足');save.coins-=c;save.army[b.dataset.buy]++;persist();$('recruit').click();update()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{const t=b.dataset.level,c=100*save.levels[t];if(save.levels[t]>=5)return notice('最大レベル');if(save.coins<c)return notice('コイン不足');save.coins-=c;save.levels[t]++;persist();$('recruit').click();update()})};
$('fort').onclick=()=>{let html='<p>城壁・弓兵塔・大砲はLv.1〜5で進化します。大砲はLv.3の城壁で解放。</p>';for(const type of ['wall','tower','cannon']){const lv=save.fort[type],cost=costs[type][Math.max(0,lv-1)]||160;html+='<div class="line"><div><b>'+names[type]+' Lv.'+lv+'/5</b><small>'+(type==='wall'?['未建設','木柵','石壁','強化石壁','二重城壁','巨大要塞壁'][lv]:type==='tower'?['未建設','見張り台','木製塔','石造塔','大型弓兵塔','精鋭弓兵塔'][lv]:['未設置','小型大砲','改良大砲','強化大砲','連装大砲','重砲'][lv])+'</small></div><button data-fort="'+type+'">'+(lv>=5?'最大':cost+'G 強化')+'</button></div>'}panel('🏰 防衛施設の建設',html);document.querySelectorAll('[data-fort]').forEach(b=>b.onclick=()=>{const t=b.dataset.fort,lv=save.fort[t],c=costs[t][Math.max(0,lv-1)]||160;if(lv>=5)return;if(t==='cannon'&&save.fort.wall<3)return notice('城壁Lv.3で大砲解放');if(save.coins<c)return notice('コイン不足');save.coins-=c;save.fort[t]++;persist();if(mode==='home'&&!fight)buildWorld();$('fort').click();update()})};
$('attack').onclick=()=>{if(fight)return notice('戦闘中は出撃できません');if(save.land>=5)return panel('🏆 全領土制圧','<p>すべての領土を獲得しました。今後の拡張で追加ステージを実装できます。</p>');panel('🚩 領土攻略','<p>次の敵領土：<b>'+territories[save.land]+'</b></p><p>出撃すると専用の雪原3D戦場に切り替わり、兵士が自動で戦います。負けても本拠地と商店データは維持されます。</p><button id="go">出撃する</button>');$('go').onclick=()=>{close();mode='attack';buildWorld();nextRaid=Math.max(nextRaid,elapsed+120);notice('⚔️ '+territories[save.land]+' へ出撃！');update()}};
$('return').onclick=()=>{if(mode==='attack'&&fight){finish(false)}else{mode='home';buildWorld();update()}};
let pointer=null;renderer.domElement.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(pointer){angle+=(e.clientX-pointer.x)*.007;zoom=Math.max(.75,Math.min(1.8,zoom+(e.clientY-pointer.y)*.002));pointer={x:e.clientX,y:e.clientY}}});renderer.domElement.addEventListener('pointerup',()=>pointer=null);renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(.75,Math.min(1.8,zoom+e.deltaY*.001))},{passive:true});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
buildWorld();nextRaid=elapsed+180;update();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||.016);last=now;elapsed+=dt;if(mode==='home'&&!fight){invasion+=dt;if(invasion>=10){invasion-=10;save.coins+=25;persist()}if(save.land>0&&elapsed>=nextRaid){raid();nextRaid=elapsed+Math.max(80,230-save.land*26)}}if(fight)combat(dt);const d=zoom*(innerWidth<650?32:28);camera.position.set(Math.sin(angle)*d,d*.86,Math.cos(angle)*d);camera.lookAt(0,0,0);renderer.render(scene,camera);if(Math.floor(now/700)!==Math.floor((now-dt*1000)/700))update()}requestAnimationFrame(loop);
window.frostWarDiagnostics=()=>({mode,coins:save.coins,territories:save.land,army:save.army,levels:save.levels,fort:save.fort,fighting:!!fight,units:units.length});
</script></body></html>
