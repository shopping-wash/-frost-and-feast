<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雪原の商店｜動くGLBモデル</title><style>body{margin:0;background:#102033;color:white;font:14px system-ui}#view{position:fixed;inset:0}.ui{position:fixed;bottom:10px;left:10px;right:10px;max-width:540px;margin:auto;padding:14px;border-radius:12px;background:#08192de8;border:1px solid #7895a9}h2{font-size:17px;margin:0 0 7px}button,select,label{padding:10px;background:#24506b;color:white;border:1px solid #9bb7cc;border-radius:8px;font:inherit}button{cursor:pointer}label{display:block;text-align:center;margin:7px 0}input{display:none}#clips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}#status{font-size:12px;color:#c9dfef;margin-top:8px}a{color:#aee5ff}</style></head><body><div id="view"></div><div class="ui"><h2>❄ 実物3Dキャラクター動作確認</h2><div>ドラッグで360°回転 / ピンチで拡大</div><label>📂 GLBファイルを選択<input id="file" type="file" accept=".glb,.gltf"></label><select id="kind"><option value="Soldier">兵士（汎用）</option><option value="Xbot">Xbot（人型）</option><option value="Michelle">Michelle（人型）</option><option value="RobotExpressive">RobotExpressive（ロボット）</option></select> <button id="auto">選択した3Dモデルを表示</button><div id="clips"></div><div id="status">モデルを選択し「表示」を押してください。※4体は動作検証用で、弓兵・盾兵・傭兵の完成モデルではありません。</div><p style="font-size:11px"><a href="https://gobkit.itch.io/gobkit-free-character-pack-vol-3" target="_blank">Gobkit無料モデル配布元（CC0）</a></p></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">import * as T from "three";import{GLTFLoader}from"three/addons/loaders/GLTFLoader.js";import{OrbitControls}from"three/addons/controls/OrbitControls.js";const status=document.querySelector('#status'),clips=document.querySelector('#clips');const scene=new T.Scene();scene.background=new T.Color(0x172a3c);const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.05,100);camera.position.set(3,2.6,4);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#view').append(renderer.domElement);const control=new OrbitControls(camera,renderer.domElement);control.target.set(0,1,0);control.enableDamping=true;scene.add(new T.HemisphereLight(0xd9ecff,0x384357,2.6));const sun=new T.DirectionalLight(0xffe7c7,3);sun.position.set(4,7,5);scene.add(sun);const ground=new T.Mesh(new T.CircleGeometry(12,48),new T.MeshStandardMaterial({color:0xbac9d4}));ground.rotation.x=-Math.PI/2;scene.add(ground);let model,mixer,active,url;const loader=new GLTFLoader();function load(src,name){status.textContent='読み込み中：'+name;loader.load(src,g=>{if(model)scene.remove(model);model=g.scene;scene.add(model);const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());if(size.y){const scale=2.4/size.y;model.scale.setScalar(scale);model.position.set(-center.x*scale,-box.min.y*scale,-center.z*scale)}if(mixer)mixer.stopAllAction();mixer=new T.AnimationMixer(model);active=null;clips.replaceChildren();for(const clip of g.animations){const b=document.createElement('button');b.textContent=clip.name;b.onclick=()=>{if(active)active.fadeOut(.2);active=mixer.clipAction(clip);active.reset().fadeIn(.2).play()};clips.append(b)}const idle=g.animations.find(x=>/idle/i.test(x.name))||g.animations[0];if(idle){active=mixer.clipAction(idle);active.play()}status.textContent=name+'：'+g.animations.length+'種類の動作を読み込みました。';},undefined,e=>{console.error(e);status.textContent='取得できません。配布元からGLBを保存し「GLBファイルを選択」で開いてください。'})}document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);load(url,f.name)};document.querySelector('#auto').onclick=()=>{const id=document.querySelector('#kind').value;const files={Soldier:'https://threejs.org/examples/models/gltf/Soldier.glb',Xbot:'https://threejs.org/examples/models/gltf/Xbot.glb',Michelle:'https://threejs.org/examples/models/gltf/Michelle.glb',RobotExpressive:'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb'};load(files[id],id+'（動作検証用）')};window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};const clock=new T.Clock();function loop(){requestAnimationFrame(loop);if(mixer)mixer.update(Math.min(clock.getDelta(),.05));else clock.getDelta();control.update();renderer.render(scene,camera)}loop();</script></body></html>
